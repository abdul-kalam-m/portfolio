<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Abdul Kalam">
  <!--
    A map plate: the graticule, and one line of water crossing it.
    Cartographic modern (OPERATING_GUIDE.md §4.1) — the map is the ornament.
    Colours track the accent token in both themes so the mark reads on light and dark
    browser chrome alike.
  -->
  <style>
    .plate { fill: #0a6c74; }
    .grid  { stroke: #ffffff; stroke-opacity: 0.34; }
    .water { stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #4fd1d9; }
      .grid  { stroke: #06282b; stroke-opacity: 0.38; }
      .water { stroke: #06282b; }
    }
  </style>

  <rect class="plate" width="32" height="32" rx="7" />

  <g class="grid" stroke-width="1.4" stroke-linecap="round" fill="none">
    <path d="M11 5.5v21M21 5.5v21M5.5 11h21M5.5 21h21" />
  </g>

  <path
    class="water"
    d="M5.5 21.5c3.6 0 3.6-5 7.2-5s3.6 5 7.2 5 3.6-5 6.6-5"
    fill="none"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
